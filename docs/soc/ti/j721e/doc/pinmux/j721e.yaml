# Fixed per-pad mux modes for the BeagleBone AI-64 J721E header example.
# Mode values follow the K3_PINMUX MUX_MODE values in the Zephyr board DTS.
schema_version: "1.0"
soc: j721e
description: "J721E header subset used by the dense BeagleBone AI-64 sample"
reference:
  title: "BeagleBone AI-64 Zephyr pinctrl"
  section: "beaglebone_ai64_j721e_main_r5f0_0-pinctrl.dtsi"
domains:
  VDDSHV_MAIN:
    io_voltages: [1.8, 3.3]
    configurable: true
  VDDSHV_MCU:
    io_voltages: [1.8, 3.3]
    configurable: true
pad_defaults:
  type: io
  domain: VDDSHV_MAIN
  tolerance: {class: LVCMOS}
pads:
  P8_34:
    aliases: [UART2_TXD]
    functions:
      - {function: UART2_TXD, peripheral: UART2, signal: TXD, class: digital, direction: out, mode: 14}
      - {function: GPIO0_14, peripheral: GPIO0, signal: "14", class: gpio, mode: 7}
  P8_22:
    aliases: [UART2_RXD]
    functions:
      - {function: UART2_RXD, peripheral: UART2, signal: RXD, class: digital, direction: in, mode: 14}
      - {function: GPIO0_13, peripheral: GPIO0, signal: "13", class: gpio, mode: 7}
  P9_17:
    aliases: [I2C6_SCL]
    functions:
      - {function: I2C6_SCL, peripheral: I2C6, signal: SCL, class: digital, direction: inout, mode: 2}
      - {function: GPIO1_24, peripheral: GPIO1, signal: "24", class: gpio, mode: 7}
  P9_18:
    aliases: [I2C6_SDA]
    functions:
      - {function: I2C6_SDA, peripheral: I2C6, signal: SDA, class: digital, direction: inout, mode: 2}
      - {function: GPIO1_25, peripheral: GPIO1, signal: "25", class: gpio, mode: 7}
