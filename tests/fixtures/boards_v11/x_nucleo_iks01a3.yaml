# Shield: plugs into a connector binding, two variants in one dir (standard / shub),
# solder-bridge-selected interrupt routing.
schema_version: "1.1"
board: x_nucleo_iks01a3
kind: shield
plugs_into: [{binding: arduino-header-r3}]
variants:
  x_nucleo_iks01a3_shub:
    description: SensorHub mode - LSM6DSO masters the other sensors
    set:
      d14: {notes: Unused in SensorHub mode}
faces:
  top:
    underlay: iks01a3.webp
    children:
      - id: arduino
        kind: group
        point: [0.5, 0.5]
        children:
          - {id: d14, kind: pin, silk: SDA, plug: {binding: arduino-header-r3, nexus_index: 20},
             electrical: {bias: pull_up, bias_source: external, pull_ohm: 4700}}
          - {id: d15, kind: pin, silk: SCL, plug: {binding: arduino-header-r3, nexus_index: 21}}
          - {id: d4, kind: pin, silk: INT1, plug: {binding: arduino-header-r3, contact: D4},
             gating: {kind: solder_bridge, ref: SB18, default: closed}}
          - {id: v3v3, kind: pin, silk: 3V3, plug: {binding: arduino-header-r3, contact: "4"},
             net: {role: power_in, rail: 3V3, nominal_v: 3.3}}
          - {id: gnd, kind: pin, silk: GND, plug: {binding: arduino-header-r3, contact: "6"}, net: {role: ground}}
