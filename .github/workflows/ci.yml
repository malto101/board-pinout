name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and checks
        run: python -m pip install -e ".[dev,sphinx]"
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check src tests
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs _site
      - name: Validate SoC fixtures
        run: python -m board_pinout.cli soc-pads validate tests/fixtures/soc_pads

  editor:
    name: Editor and generated assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build editor and widget
        working-directory: editor
        run: npm ci && npm run build
      - name: Check generated widget
        run: git diff --exit-code -- src/board_pinout/static/board_pinout/board-pinout.js

  package:
    name: Package smoke check
    runs-on: ubuntu-latest
    needs: [python, editor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and check resources
        run: |
          python -m venv /tmp/board-pinout-smoke
          /tmp/board-pinout-smoke/bin/python -m pip install dist/*.whl
          /tmp/board-pinout-smoke/bin/python scripts/check_package.py
      - name: Install sdist and check resources
        run: |
          mkdir /tmp/board-pinout-sdist
          tar -xzf dist/*.tar.gz -C /tmp/board-pinout-sdist
          source_dir="$(find /tmp/board-pinout-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python -m venv /tmp/board-pinout-sdist-smoke
          /tmp/board-pinout-sdist-smoke/bin/python -m pip install "$source_dir"
          /tmp/board-pinout-sdist-smoke/bin/python scripts/check_package.py
