name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install -e ".[sphinx]"

      - name: Build editor
        working-directory: editor
        run: npm ci && npm run build

      - name: Build documentation
        run: |
          sphinx-build -W --keep-going -b html docs _site
          mkdir -p _site/editor
          cp -a editor/dist/. _site/editor/

      - name: Verify documentation and editor entrypoints
        run: |
          test -f _site/index.html
          test -f _site/editor/index.html
          test -f _site/editor/types.bundle.json
          test -n "$(find _site/editor/assets -type f -name '*.js' -print -quit)"
          test -n "$(find _site/editor/assets -type f -name '*.css' -print -quit)"
          test -f _site/editor/examples/esp32s3_devkitc/pinout.yaml
          test -f _site/editor/examples/esp32s3_devkitc/esp32s3_devkitc.webp


      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
