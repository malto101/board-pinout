name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install -e ".[sphinx]"

      - name: Build editor
        working-directory: editor
        run: npm ci && npm run build

      - name: Build documentation
        run: |
          sphinx-build -W --keep-going -b html docs _site
          mkdir -p _site/editor
          cp -a editor/dist/. _site/editor/

      - name: Verify documentation and editor entrypoints
        run: |
          test -f _site/index.html
          test -f _site/editor/index.html
          test -f _site/editor/types.bundle.json
          test -n "$(find _site/editor/assets -type f -name '*.js' -print -quit)"
          test -n "$(find _site/editor/assets -type f -name '*.css' -print -quit)"
          test -f _site/editor/examples/esp32s3_devkitc/pinout.yaml
          test -f _site/editor/examples/esp32s3_devkitc/esp32s3_devkitc.webp


      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
